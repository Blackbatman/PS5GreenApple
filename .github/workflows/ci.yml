name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  host-shots:
    name: Host build + screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build headless dump binary
        run: make host

      - name: Render screenshots
        run: make shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

  ps5-elf:
    name: PS5 payload ELF
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps5-payload-dev/sdk:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 for PS5
        run: |
          git clone --recursive --depth 1 https://github.com/ps5-payload-dev/SDL /tmp/SDL
          cd /tmp/SDL
          if [ -f build-scripts/ps5-payload-sdk.sh ]; then
            # official build path: CMake driven by the SDK toolchain environment
            source "$PS5_PAYLOAD_SDK/toolchain/prospero.sh"
            cmake -DCMAKE_BUILD_TYPE=Release -B build-ps5 -S .
            cmake --build build-ps5 --parallel "$(nproc)"
            cmake --install build-ps5 --prefix "$PS5_PAYLOAD_SDK/target"
          else
            # fallback for older branches that ship autotools
            mkdir build && cd build
            ../configure --host=x86_64-pc-freebsd12-elf \
                --prefix="$PS5_PAYLOAD_SDK/target" --disable-shared --enable-static
            make -j"$(nproc)" && make install
          fi

      - name: Build ps5greenapple.elf
        run: make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5greenapple-elf
          path: ps5greenapple.elf
